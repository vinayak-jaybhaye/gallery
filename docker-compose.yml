services:
  db:
    image: postgres:16
    container_name: gallery-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gallery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d gallery" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gallery-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3
    container_name: gallery-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=1
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./localstack-init.sh:/etc/localstack/init/ready.d/10-localstack-init.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10

  db-migrate:
    image: node:20-alpine
    container_name: gallery-db-migrate
    depends_on:
      db:
        condition: service_healthy
    working_dir: /workspace
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/gallery?connection_limit=100
    volumes:
      - ./:/workspace
    command: >
      sh -c "corepack enable && pnpm --filter @gallery/db exec prisma migrate deploy"
    restart: "no"

  # ── Application services ──────────────────────

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/gallery?connection_limit=100
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://localstack:4566
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:4566}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

  nginx:
    image: nginx:alpine
    container_name: gallery-nginx
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "3000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: gallery-worker
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/gallery?connection_limit=100
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://localstack:4566
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:4566}

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: gallery-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata:
  localstack-data:
